<div class="min-h-screen bg-slate-100 flex">
  <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
    <div class="p-5 border-b border-slate-800">
      <p class="font-bold text-lg leading-tight">Pressy Admin</p>
      <p class="text-xs text-slate-400 mt-1">Gestion du pressing</p>
    </div>

    <nav class="flex-1 p-4 space-y-2">
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="bg-cyan-500/20 text-cyan-300 border-l-4 border-cyan-400"
        class="block px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 transition-colors border-l-4 border-transparent"
      >
        📊 Dashboard
      </a>
      <a
        routerLink="/admin/tickets"
        routerLinkActive="bg-cyan-500/20 text-cyan-300 border-l-4 border-cyan-400"
        class="block px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 transition-colors border-l-4 border-transparent"
      >
        🎫 Gestion Tickets
      </a>
      <a
        routerLink="/admin/services"
        routerLinkActive="bg-cyan-500/20 text-cyan-300 border-l-4 border-cyan-400"
        class="block px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 transition-colors border-l-4 border-transparent"
      >
        🧺 Gestion Services
      </a>
      <a
        routerLink="/boutique"
        class="block px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 transition-colors"
      >
        🛍️ Voir la boutique
      </a>
    </nav>

    <div class="p-4 border-t border-slate-800">
      <p class="text-xs text-slate-400">Connecté en tant que</p>
      <p class="text-sm font-semibold truncate mt-0.5">{{ session.user()?.name }}</p>
      <button
        (click)="logout()"
        class="mt-3 w-full px-3 py-2 rounded-lg bg-red-500/15 text-red-300 text-sm font-medium hover:bg-red-500/25 transition-colors"
      >
        Se déconnecter
      </button>
    </div>
  </aside>

  <main class="flex-1 overflow-auto">
    <router-outlet></router-outlet>
  </main>
</div>
