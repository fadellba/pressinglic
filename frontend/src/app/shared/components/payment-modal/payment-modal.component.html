<div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
      <div
        appFocusTrap
        role="dialog"
        aria-modal="true"
        aria-labelledby="payment-modal-title"
        class="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-md w-full shadow-2xl text-white"
        (keydown.escape)="dismissed.emit()"
      >

        <div class="w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-xl mb-4">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="20" height="12" x="2" y="6" rx="2" />
            <circle cx="12" cy="12" r="2" />
            <path d="M6 12h.01M18 12h.01" />
          </svg>
        </div>

        <h3 id="payment-modal-title" class="text-xl font-bold mb-2">Encaisser le Ticket {{ ticket.code_ticket }}</h3>
        <p class="text-xs text-slate-400 mb-6 leading-relaxed">
          Le statut "Récupéré" exige un règlement préalable. Veuillez confirmer l'encaissement de la somme en espèces.
        </p>

        <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 mb-6 space-y-2">
          <div class="flex justify-between text-xs text-slate-400">
            <span>Client</span>
            <span class="font-bold text-white">{{ ticket.client?.name }}</span>
          </div>
          <div class="flex justify-between text-xs text-slate-400">
            <span>Mode d'encaissement</span>
            <span class="font-bold text-cyan-400">Espèces au comptoir</span>
          </div>
          <div class="flex justify-between items-center text-sm font-extrabold pt-2 border-t border-slate-800">
            <span>Montant à encaisser</span>
            <span class="text-fresh-400 text-lg">{{ ticket.montant_total | cfa }}</span>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <button
            (click)="dismissed.emit()"
            class="btn btn-md btn-outline-dark flex-1"
          >
            Annuler
          </button>
          <button
            (click)="confirmed.emit()"
            [disabled]="isProcessing"
            class="btn btn-md flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold shadow-lg shadow-emerald-500/20"
          >
            @if (isProcessing) {
              <span>Encaissement...</span>
            } @else {
              <span>Valider le paiement</span>
            }
          </button>
        </div>

      </div>
    </div>
